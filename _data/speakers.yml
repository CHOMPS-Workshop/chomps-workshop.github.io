- num_row: 1
  speakers:
    - name: Isabelle Augenstien
      title: Prof.
      affiliation: University of Copenhagen, Denmark
      photo: isabelle.jpg
      url: https://annargrs.github.io/
      bio: "Isabelle AUGENSTEIN is a professor at the University of Copenhagen and the head of the CopeNLU research group. She is known for her pioneering work in factuality, explainability and fairness in NLP, along with a more recent interest in cross-cultural NLP."
- num_row: 2
  speakers:
    - name: Iacer Calixto
      title: Prof.
      affiliation: University of Amsterdam, Netherlands
      photo: icalixto.jpg
      url: https://danishpruthi.com/
      bio: "Iacer CALIXTO is an assistant professor at the University of Amsterdam and leads the NLP4Health Lab Amsterdam group. He is known for his research on trustworthy medical LLMs, with a focus on clinical reasoning, uncertainty, calibration, and fairness."