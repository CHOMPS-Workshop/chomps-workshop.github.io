- title: "SHROOM-Visions 2.0"
  image: "shroomvision2.png"
  description: >
          This task is the 5th edition in the <a href="https://helsinki-nlp.github.io/shroom/">SHROOM</a> shared tasks series. 
          Following the success of SHROOM-Visions shared task, we are launching a new challenge on model-agnostic hallucination detection for Vision-and-Language Models (VLMs), with a focus on generalization to unseen languages and domains.
          
          Can your hallucination detector work when the language and domain are completely new?

          To participate fill the registration form: <a href="https://forms.gle/h2BfwdCFawDNCMNQ6">https://forms.gle/h2BfwdCFawDNCMNQ6</a> . 
          
